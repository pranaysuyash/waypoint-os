description: Waypoint OS hybrid risk-flag lane (KDD §7.3 port)

prompts:
  - "{{note}}"

providers:
  - python:///Users/pranay/Projects/travel_agency_agent/data/experiments/hybrid_kdd_v1/promptfoo_provider.py

defaultTest:
  assert:
    - type: is-json
    - type: javascript
      value: >-
          const o = JSON.parse(output); Array.isArray(o.risks) && (o.has_destination || !o.risks.some(r => r.flag === 'visa_timeline_risk'))

tests:
