[project]
name = "travel-agency-agent"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "pandas>=3.0.2",
    "pydantic>=2.12.5",
    "rich>=14.3.3",
    # --- Auth & Database (Phase 0) ---
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "pyjwt>=2.10.0",
    "bcrypt>=4.3.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.3.0",
    "pydantic-to-typescript>=2.0.0",
    "cryptography>=42.0.0",
    # --- LLM Usage Guard (P4-03) ---
    "redis>=5.0.0",
    "opentelemetry-distro>=0.62b1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "slowapi>=0.1.9",
    "openai>=2.32.0",
    "playwright>=1.60.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=1.11.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

# =============================================================================
# LLM Dependencies (Optional - Install as Needed)
# =============================================================================
# To install LLM support:
#   uv add --group llm google-genai
#   uv add --group llm transformers torch sentencepiece
#
# Or install all: uv add --group llm --all-groups llm
# =============================================================================
llm = [
    # Gemini API (primary - google-genai is the successor to deprecated google-generativeai)
    "google-genai>=1.74.0",
    # OpenAI API (fallback)
    "openai>=1.50.0",
    # Local LLM support (HuggingFace transformers)
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]

# =============================================================================
# Privacy / NLP Dependencies (Optional - Install as Needed)
# =============================================================================
# Layer 2 NLP PII guard: SpaCy NER for person names, org references, and
# location entities that regex patterns cannot catch in freeform WhatsApp text.
#
# To install:
#   uv add --group privacy spacy
#   python -m spacy download en_core_web_sm
#   # OR use the setup script:
#   bash scripts/setup_nlp_models.sh
#
# When NOT installed: privacy_guard.py falls back to regex-only mode (Layer 1).
# Set NLP_PII_GUARD_ENABLED=0 to disable even if installed (e.g. in unit tests).
# =============================================================================
privacy = [
    "spacy>=3.7.0",
]

[tool.ruff.lint.per-file-ignores]
"tests/test_llm_clients.py" = ["F401"]
"tools/verify_frontier_models.py" = ["F401"]
"notebooks/*" = ["E402"]
"scripts/*.py" = ["E402"]
"seed_test_user.py" = ["E402"]
"spine_api/contract.py" = ["E402"]
"spine_api/persistence.py" = ["E402"]
"spine_api/routers/settings.py" = ["E402"]
"spine_api/server.py" = ["E402"]
"spine_api/watchdog.py" = ["E402"]
"src/evals/audit/rules/extraction.py" = ["E402"]
"src/evals/audit/rules/pipeline.py" = ["E402"]
"src/intake/decision.py" = ["E402"]
"src/intake/extractors.py" = ["E402"]
"src/intake/orchestration.py" = ["E402"]
"tests/test_integrity.py" = ["E402"]
"tests/test_spine_pipeline_unit.py" = ["E402"]
"tests/test_state_contract_parity.py" = ["E402"]
"tools/eval_runner.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore:builtin type.*has no __module__:DeprecationWarning",
]

# =============================================================================
# Type checking (mypy) — scoped to security/tenancy-critical surfaces.
# Whole-repo mypy is intentionally not enabled: it would surface hundreds of
# pre-existing errors across 70k LOC and block legitimate change. Instead we
# hard-gate the files where a type mistake can cause a tenant isolation or
# data-integrity defect. Extend this list as the codebase becomes typed.
# =============================================================================
[tool.mypy]
python_version = "3.13"
files = [
    "spine_api/core/auth.py",
    "spine_api/core/rls.py",
    "spine_api/core/security.py",
    "src/security/privacy_guard.py",
    "spine_api/routers/commission.py",
    "spine_api/routers/group_booking.py",
    "spine_api/routers/multimodal.py",
    "spine_api/routers/customer_memory.py",
    "spine_api/routers/price_lock.py",
    "spine_api/routers/messaging.py",
]
ignore_missing_imports = true
# Do not follow transitive imports — gate only the listed files. Following
# imports surfaces hundreds of pre-existing errors in untyped dependencies
# (analytics/logger, orchestration, gates) that are unrelated to the
# security/tenancy surfaces we are guarding.
follow_imports = "skip"
# Scoped to genuine type mismatches, not missing annotations. FastAPI routers
# commonly omit return type annotations; requiring them repo-wide would block
# legitimate change for mechanical noise. This catches real assignment/attr
# errors that can cause tenant-isolation or data-integrity defects.
disallow_untyped_defs = false
check_untyped_defs = false
# no_implicit_optional is OFF because FastAPI dependencies legitimately use
# `request: Request = None` (the raw Request is injected, and implicit-Optional
# is the idiomatic form here). Enabling it would block a valid FastAPI pattern.
no_implicit_optional = false
warn_unused_ignores = true


