name: CD

# TRV-N05 / FND-AUD-11: Automatic deployment on master pushes is disabled
# while Docs/LAUNCH_STATUS.md remains NO-GO. Deployments must be explicitly
# triggered via workflow_dispatch with release confirmation.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      force_deploy:
        description: "Override LAUNCH_STATUS.md NO-GO gate for manual dispatch"
        required: false
        default: false
        type: boolean


concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Launch Readiness Gate (TRV-N05 / AUD-04)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_deploy }}" = "true" ]; then
            echo "Manual workflow_dispatch with force_deploy=true — proceeding past LAUNCH_STATUS.md gate."
            exit 0
          fi
          if ! grep -Eq '^\*\*Overall Verdict\*\*:\s*`?GO`?\b' Docs/LAUNCH_STATUS.md; then
            echo "::error file=Docs/LAUNCH_STATUS.md::Deployment blocked: Docs/LAUNCH_STATUS.md is not GO. Refusing automatic production deploy."
            exit 1
          fi
          echo "Launch status verified as GO."

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # First-principles post-deploy verification check
      - name: Verify Deployment Readiness
        run: |
          echo "Starting post-deploy readiness check..."
          DEPLOYED_URL="https://spine-api.fly.dev/ready" # Must match the platform healthcheck path
          MAX_ATTEMPTS=6
          ATTEMPT=1
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT: Checking health at $DEPLOYED_URL..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOYED_URL" || echo "000")
            
            if [ "$STATUS_CODE" = "200" ]; then
              echo "Readiness check passed with HTTP 200!"
              SUCCESS=true
              break
            fi
            
            echo "Readiness check returned status code $STATUS_CODE. Waiting 10s before retry..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" = "false" ]; then
            echo "Error: Deployment readiness check failed after $MAX_ATTEMPTS attempts."
            echo "Initiating automated deployment rollback..."
            flyctl rollback -a spine-api
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
