# fly.toml — Fly.io configuration for spine-api
#
# Usage:
#   fly launch --image ghcr.io/your-org/spine-api:latest
#   fly secrets set TRAVELER_SAFE_STRICT=0
#   fly deploy

app = "spine-api"
primary_region = "iad"

[build]
image = "ghcr.io/your-org/spine-api:latest"

[deploy]
  # Migrations target DATABASE_URL supplied through Fly secrets. The release
  # command never seeds a test/public-checker agency in production.
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  SPINE_API_HOST = "0.0.0.0"
  SPINE_API_PORT = "8000"
  # One API worker is intentional until background supervisors are split into
  # a separately deployed durable worker service.
  SPINE_API_WORKERS = "1"
  SPINE_API_RELOAD = "0"
  TRAVELER_SAFE_STRICT = "1"
  # PA-03: USE_HYBRID_DECISION_ENGINE is deliberately NOT set here. The code
  # default is now OFF so the serving spine stays deterministic by
  # architecture, not by credential absence. Opt in explicitly (e.g.
  # `fly env set USE_HYBRID_DECISION_ENGINE=1`) only with review — enabling
  # it puts credential-gated LLM calls on the serving path (logged loudly at
  # startup when enabled).
  TRIPSTORE_BACKEND = "sql"
  SPINE_API_IDEMPOTENCY_BACKEND = "sql"
  # PA-12: opt the deployment into the throttled lazy run-ledger GC (terminal
  # runs older than 30 days, hard-capped per pass). Dev compose keeps this
  # OFF so local history is never pruned implicitly.
  WAYPOINT_RUN_LEDGER_GC = "1"
  # Set PUBLIC_CHECKER_AGENCY_ID, DATABASE_URL, REDIS_URL, JWT_SECRET,
  # PROPOSAL_SIGNING_KEY, and SPINE_API_CORS with `fly secrets set`.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    port = 8000
    path = "/ready"
    interval = "30s"
    timeout = "10s"
    grace_period = "5s"
