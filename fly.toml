# fly.toml — Fly.io configuration for spine-api
#
# Usage:
#   fly launch --image ghcr.io/your-org/spine-api:latest
#   fly secrets set TRAVELER_SAFE_STRICT=0
#   fly deploy

app = "spine-api"
primary_region = "iad"

[build]
image = "ghcr.io/your-org/spine-api:latest"

[deploy]
  # Migrations target DATABASE_URL supplied through Fly secrets. The release
  # command never seeds a test/public-checker agency in production.
  release_command = "alembic upgrade head"

[env]
  PORT = "8000"
  ENVIRONMENT = "production"
  SPINE_API_HOST = "0.0.0.0"
  SPINE_API_PORT = "8000"
  # One API worker is intentional until background supervisors are split into
  # a separately deployed durable worker service.
  SPINE_API_WORKERS = "1"
  SPINE_API_RELOAD = "0"
  TRAVELER_SAFE_STRICT = "1"
  # ADR-008 item 2 (Addendum 9 amendment): every envelope declares its
  # decision-path mode explicitly — zero implicit defaults. This envelope
  # serves real traveler data, so it pins 0 until the X-09 PII-egress gate
  # closes; the KDD gate (F1 0.808 champion) is the recorded evidence for
  # the post-gate opt-in review. The startup rung log makes the effective
  # mode observable at boot.
  USE_HYBRID_DECISION_ENGINE = "0"
  TRIPSTORE_BACKEND = "sql"
  SPINE_API_IDEMPOTENCY_BACKEND = "sql"
  # FND-0262: pin the encryption posture explicitly. Without production mode
  # the encryption layer falls back to a committed dev key. ENCRYPTION_KEY
  # itself is a secret — provide it via `fly secrets set ENCRYPTION_KEY=...`.
  DATA_PRIVACY_MODE = "production"
  # PA-12: opt the deployment into the throttled lazy run-ledger GC (terminal
  # runs older than 30 days, hard-capped per pass). Dev compose keeps this
  # OFF so local history is never pruned implicitly.
  WAYPOINT_RUN_LEDGER_GC = "1"
  # WOBS GO punch-list (Part 3.7): public checker exposure envelope.
  # Kill switch stays at "1" (surface ON); a live incident flips it to "0"
  # via `fly env set PUBLIC_CHECKER_ENABLED=0 && fly deploy` — no redeploy
  # of code required beyond config propagation.
  PUBLIC_CHECKER_ENABLED = "1"
  # D-03 retention (EX-02 defaults): trips + tokens expire at 90 days; the
  # daily sweep thread prunes trips, tokens, consented upload artifacts, and
  # rotated event segments. Set "0" only with a documented rationale.
  PUBLIC_CHECKER_RETENTION_DAYS = "90"
  PUBLIC_CHECKER_RETENTION_SWEEP_ENABLED = "1"
  PUBLIC_CHECKER_RETENTION_SWEEP_HOURS = "24"
  # Ghost Hotel Test (entity existence via OSM Nominatim, advisory-only).
  ENTITY_CHECK_ENABLED = "1"
  # Set PUBLIC_CHECKER_AGENCY_ID, DATABASE_URL, REDIS_URL, JWT_SECRET,
  # PROPOSAL_SIGNING_KEY, ENCRYPTION_KEY, and SPINE_API_CORS with `fly secrets set`.

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    port = 8000
    path = "/ready"
    interval = "30s"
    timeout = "10s"
    grace_period = "5s"
