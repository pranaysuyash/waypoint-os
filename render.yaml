# render.yaml — Render Blueprint for spine-api
#
# Deploy with:
#   render blueprint render.yaml
#
# Or connect directly on render.com to this repo and use:
#   Build Command: uv sync --frozen
#   Start Command: uvicorn spine_api.server:app --host 0.0.0.0 --port 8000 --workers 1

services:
  - type: web
    name: spine-api
    env: python
    region: oregon
    plan: starter
    buildCommand: uv sync --frozen
    preDeployCommand: uv run alembic upgrade head
    startCommand: uvicorn spine_api.server:app --host 0.0.0.0 --port 8000 --workers 1
    healthCheckPath: /ready
    envVars:
      - key: SPINE_API_PORT
        value: 8000
      - key: SPINE_API_WORKERS
        value: 1
      - key: ENVIRONMENT
        value: production
      - key: USE_HYBRID_DECISION_ENGINE
        value: 0
      - key: TRIPSTORE_BACKEND
        value: sql
      - key: SPINE_API_IDEMPOTENCY_BACKEND
        value: sql
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PROPOSAL_SIGNING_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PUBLIC_CHECKER_AGENCY_ID
        sync: false
      - key: SPINE_API_CORS
        sync: false
      - key: TRAVELER_SAFE_STRICT
        sync: false
      - key: UV_SYMLINK
        value: false
